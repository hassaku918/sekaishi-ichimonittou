name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android platform
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Ensure Gradle Wrapper jar
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sekaishi-qa-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 7

      - name: Publish APK to release on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$APK" --title "世界史一問一答 APK" --notes "Latest signed release build from main. Run ${{ github.run_number }}."

      - name: Commit build result to build-logs branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/logrepo
          cd /tmp/logrepo
          git init -q
          { echo "status: ${{ job.status }}"; echo "run: ${{ github.run_number }}"; echo "sha: ${{ github.sha }}"; echo; echo "== errors =="; grep -E "^e: |error:|FAILED|What went wrong" -A 3 "$GITHUB_WORKSPACE/build-log.txt" 2>/dev/null | head -60; echo; echo "== tail =="; tail -30 "$GITHUB_WORKSPACE/build-log.txt" 2>/dev/null || echo "no log"; } > build-log.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build-log.txt
          git commit -q -m "build result: ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:build-logs
